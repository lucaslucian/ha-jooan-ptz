<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">JOOAN Local Control — visão do dashboard</title>
  <desc id="desc">Conceito vetorial do painel Home Assistant com estado da câmera, duas lentes, PTZ, detecção, gravação e diagnóstico local.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="1" stop-color="#111b26"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27c1e8"/>
      <stop offset="1" stop-color="#1689c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <style>
      .title{font:700 34px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f4f7fb}
      .sub{font:500 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#9fb0c2}
      .kicker{font:700 13px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:1.5px;fill:#64d7f1}
      .h2{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f4f7fb}
      .body{font:500 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#b5c2cf}
      .small{font:600 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#8ea0b2}
      .value{font:700 18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#ecf5fb}
      .card{fill:#141f2a;stroke:#263849;stroke-width:2}
      .soft{fill:#0f1821;stroke:#223241;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <rect x="42" y="36" width="1516" height="94" rx="22" fill="#121c26" stroke="#263849" stroke-width="2"/>
  <circle cx="86" cy="83" r="22" fill="url(#cyan)"/>
  <path d="M77 82h18M86 73v18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="124" y="76" class="title">JOOAN Local Control</text>
  <text x="124" y="104" class="sub">JA-A12 · LAN only · Home Assistant</text>
  <rect x="1262" y="61" width="127" height="44" rx="22" fill="#16382d" stroke="#2a6e55"/>
  <circle cx="1290" cy="83" r="7" fill="#4fd08b"/>
  <text x="1310" y="89" class="body" fill="#86e8b4">Online</text>
  <rect x="1402" y="61" width="122" height="44" rx="22" fill="#0d2834" stroke="#1d637b"/>
  <text x="1430" y="89" class="body" fill="#71dff4">LAN only</text>

  <g filter="url(#shadow)">
    <rect class="card" x="42" y="158" width="480" height="315" rx="22"/>
    <text x="70" y="190" class="kicker">CÂMERAS</text>
    <text x="70" y="222" class="h2">Duas lentes locais</text>
    <rect class="soft" x="70" y="248" width="206" height="150" rx="14"/>
    <rect class="soft" x="290" y="248" width="204" height="150" rx="14"/>
    <path d="M91 365l52-52 38 36 28-24 46 40" fill="none" stroke="#31546a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="224" cy="286" r="15" fill="#2e617a"/>
    <path d="M311 365l44-38 31 20 38-46 49 64" fill="none" stroke="#31546a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="454" cy="286" r="15" fill="#2e617a"/>
    <text x="83" y="424" class="small">ch00 · PTZ</text>
    <text x="303" y="424" class="small">ch01 · fixa</text>
    <text x="70" y="452" class="body">RTSP · H.264 · snapshot/preview local</text>

    <rect class="card" x="544" y="158" width="372" height="315" rx="22"/>
    <text x="572" y="190" class="kicker">MOVIMENTO</text>
    <text x="572" y="222" class="h2">PTZ</text>
    <circle cx="730" cy="329" r="80" fill="#0e1821" stroke="#2a4052" stroke-width="2"/>
    <circle cx="730" cy="329" r="34" fill="#223647"/>
    <text x="710" y="336" class="small" fill="#d8e5ef">STOP</text>
    <path d="M730 263l-16 22h32zM730 395l-16-22h32zM664 329l22-16v32zM796 329l-22-16v32z" fill="#64d7f1"/>
    <text x="572" y="446" class="body">CGI validado + ONVIF laboratório</text>

    <rect class="card" x="938" y="158" width="620" height="315" rx="22"/>
    <text x="966" y="190" class="kicker">ESTADO LOCAL</text>
    <text x="966" y="222" class="h2">Detecção, luz e gravação</text>
    <g transform="translate(966 252)">
      <rect class="soft" width="178" height="78" rx="13"/><text x="16" y="28" class="small">Motion</text><text x="16" y="57" class="value">Ativo · média</text>
      <rect class="soft" x="194" width="178" height="78" rx="13"/><text x="210" y="28" class="small">Floodlight</text><text x="210" y="57" class="value">Infravermelho</text>
      <rect class="soft" x="388" width="178" height="78" rx="13"/><text x="404" y="28" class="small">Gravação</text><text x="404" y="57" class="value">SD · ativa</text>
      <rect class="soft" y="94" width="178" height="78" rx="13"/><text x="16" y="122" class="small">Auto tracking</text><text x="16" y="151" class="value">Desligado</text>
      <rect class="soft" x="194" y="94" width="178" height="78" rx="13"/><text x="210" y="122" class="small">Timezone</text><text x="210" y="151" class="value">GMT-03:00</text>
      <rect class="soft" x="388" y="94" width="178" height="78" rx="13"/><text x="404" y="122" class="small">ONVIF Events</text><text x="404" y="151" class="value">PullPoint</text>
    </g>
    <text x="966" y="451" class="body">Porta 9898 · baseline/diff · estado sem cloud</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="42" y="500" width="480" height="340" rx="22"/>
    <text x="70" y="532" class="kicker">SERVIÇOS</text>
    <text x="70" y="564" class="h2">Saúde local</text>
    <g transform="translate(70 594)">
      <rect class="soft" width="424" height="48" rx="12"/><circle cx="24" cy="24" r="7" fill="#4fd08b"/><text x="44" y="30" class="body">HTTP / CGI · porta 80</text><text x="335" y="30" class="small">OK</text>
      <rect class="soft" y="60" width="424" height="48" rx="12"/><circle cx="24" cy="84" r="7" fill="#4fd08b"/><text x="44" y="90" class="body">RTSP · porta 554</text><text x="335" y="90" class="small">OK</text>
      <rect class="soft" y="120" width="424" height="48" rx="12"/><circle cx="24" cy="144" r="7" fill="#4fd08b"/><text x="44" y="150" class="body">OEM features · porta 9898</text><text x="335" y="150" class="small">OK</text>
      <rect class="soft" y="180" width="424" height="48" rx="12"/><circle cx="24" cy="204" r="7" fill="#4fd08b"/><text x="44" y="210" class="body">ONVIF · porta 8899</text><text x="335" y="210" class="small">OK</text>
    </g>

    <rect class="card" x="544" y="500" width="1014" height="340" rx="22"/>
    <text x="572" y="532" class="kicker">LABORATÓRIO</text>
    <text x="572" y="564" class="h2">Testes controlados de protocolo</text>
    <rect x="572" y="594" width="958" height="70" rx="14" fill="#10212b" stroke="#215369"/>
    <text x="594" y="621" class="small">GoAhead CGI candidates</text>
    <text x="594" y="650" class="body">getVideoSettings · getmotiondetectSettings · round-trip com readback</text>
    <rect x="572" y="678" width="466" height="126" rx="14" fill="#101b24" stroke="#2a3e4e"/>
    <text x="594" y="708" class="small">Escrita OEM mapeada</text>
    <text x="594" y="738" class="body">floodlight · zonas · sensibilidade</text>
    <text x="594" y="766" class="body">tracking · flip · timezone</text>
    <rect x="1052" y="678" width="478" height="126" rx="14" fill="#211a14" stroke="#674b27"/>
    <text x="1074" y="708" class="small" fill="#f5bd55">Guardrails</text>
    <text x="1074" y="738" class="body">Sem firmware, reset, Wi-Fi ou proxy arbitrário</text>
    <text x="1074" y="766" class="body">Credenciais permanecem somente no backend</text>
  </g>
</svg>