configuration:
  camera_ip:
    name: Camera IP address
    description: Local RFC1918, ULA or link-local IP address of the camera. Public addresses and hostnames are rejected.
  camera_user:
    name: Camera username
    description: Local camera user. Most tested devices use admin.
  camera_password:
    name: Camera password
    description: Local HTTP/CGI password used by the /goform/ endpoints. Do not use the RTSP key when the firmware keeps separate credentials. It is used only by the backend and is not returned by the dashboard API.
  http_port:
    name: HTTP / CGI port
    description: Local HTTP port used by JOOAN CGI endpoints.
  features_port:
    name: Device features port
    description: Local HTTP port used for get_deviceFeatures. Usually 9898.
  rtsp_port:
    name: RTSP port
    description: Local RTSP media port. Usually 554.
  onvif_port:
    name: ONVIF port
    description: Local ONVIF port used for PTZ discovery and movement. The reference JA-A12 uses 8899.
  validation_interval:
    name: Heartbeat interval
    description: Seconds between ICMP liveness checks. The heartbeat does not open HTTP, ONVIF, port 9898 or RTSP connections.
  debug:
    name: Debug logging
    description: Enables additional diagnostic logging. Credentials and authentication keys remain redacted.
