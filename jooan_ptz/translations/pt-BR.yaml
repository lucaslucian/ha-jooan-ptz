configuration:
  camera_ip:
    name: Endereço IP da câmera
    description: IP local RFC1918, ULA ou link-local da câmera. Endereços públicos e hostnames são recusados.
  camera_user:
    name: Usuário da câmera
    description: Usuário local da câmera. A maioria dos dispositivos testados utiliza admin.
  camera_password:
    name: Senha da câmera
    description: Senha local HTTP/CGI usada pelos endpoints /goform/. Não use a chave RTSP se o firmware mantiver credenciais separadas. É utilizada somente pelo backend e não é devolvida pela API do painel.
  http_port:
    name: Porta HTTP / CGI
    description: Porta HTTP local usada pelos endpoints CGI da JOOAN.
  features_port:
    name: Porta de recursos do dispositivo
    description: Porta HTTP local usada pelo get_deviceFeatures. Normalmente 9898.
  rtsp_port:
    name: Porta RTSP
    description: Porta de mídia RTSP local. Normalmente 554.
  onvif_port:
    name: Porta candidata ONVIF
    description: Porta ONVIF local. A JA-A12 de referência foi validada em 8899; outras revisões podem diferir.
  diag_callback_ip:
    name: IP LAN do Home Assistant para diagnóstico
    description: IP LAN do host Home Assistant, no mesmo /24 da câmera, usado somente pelo teste seguro de callback SetDiagMode. O navegador não controla o destino nem a porta.
  validation_interval:
    name: Intervalo do heartbeat
    description: Segundos entre verificações de disponibilidade por ICMP. O heartbeat não abre conexões HTTP, ONVIF, porta 9898 ou RTSP.
  debug:
    name: Log de depuração
    description: Ativa logs adicionais de diagnóstico. Credenciais e chaves de autenticação continuam mascaradas.
