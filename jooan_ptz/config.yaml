name: JOOAN Local Control
description: Local LAN control, RTSP snapshots and diagnostics for compatible JOOAN/CAM720 cameras
version: "0.5.2"
slug: jooan_ptz
url: "https://github.com/lucaslucian/ha-jooan-ptz"
stage: experimental
init: false
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: JOOAN Local Control
panel_admin: true
watchdog: "http://[HOST]:[PORT:8099]/healthz"
options:
  camera_ip: null
  camera_user: admin
  camera_password: null
  http_port: 80
  features_port: 9898
  rtsp_port: 554
  onvif_port: 8899
  validation_interval: 30
  debug: false
schema:
  camera_ip: str
  camera_user: str
  camera_password: password
  http_port: port
  features_port: port
  rtsp_port: port
  onvif_port: port
  validation_interval: "int(10,3600)"
  debug: bool
