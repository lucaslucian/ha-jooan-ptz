name: Validate JOOAN Local Control

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and metadata validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest pyyaml pillow -r jooan_ptz/app/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q jooan_ptz/app

      - name: Run tests
        env:
          PYTHONPATH: jooan_ptz/app
        run: pytest -q jooan_ptz/tests

      - name: Validate dashboard JavaScript
        run: node --check jooan_ptz/app/static/app.js

      - name: Validate YAML
        run: |
          python - <<'PY'
          import yaml
          paths = [
              "repository.yaml",
              "jooan_ptz/config.yaml",
              "jooan_ptz/translations/en.yaml",
              "jooan_ptz/translations/pt-BR.yaml",
          ]
          for path in paths:
              with open(path, encoding="utf-8") as file:
                  yaml.safe_load(file)
              print(f"OK: {path}")
          PY

      - name: Validate Home Assistant presentation files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          base = Path("jooan_ptz")
          required = [
              base / "README.md",
              base / "DOCS.md",
              base / "CHANGELOG.md",
              base / "icon.png",
              base / "logo.png",
              Path("docs/images/dashboard-overview.svg"),
              Path("docs/images/jooan-local-control-logo.svg"),
              Path("jooan_ptz/app/templates/index.html"),
              Path("jooan_ptz/app/static/app.css"),
              Path("jooan_ptz/app/static/app.js"),
          ]
          for path in required:
              if not path.is_file():
                  raise SystemExit(f"Missing required presentation file: {path}")
              print(f"OK: {path}")

          with Image.open(base / "icon.png") as image:
              if image.format != "PNG":
                  raise SystemExit("icon.png must be PNG")
              if image.width != image.height:
                  raise SystemExit("icon.png must be square")
              print(f"OK: icon.png {image.width}x{image.height}")

          with Image.open(base / "logo.png") as image:
              if image.format != "PNG":
                  raise SystemExit("logo.png must be PNG")
              print(f"OK: logo.png {image.width}x{image.height}")

          dashboard_svg = Path("docs/images/dashboard-overview.svg").read_text(encoding="utf-8")
          if 'viewBox="0 0 1600 900"' not in dashboard_svg:
              raise SystemExit("dashboard-overview.svg must keep the 1600x900 vector canvas")
          print("OK: dashboard-overview.svg vector 1600x900")

          logo_svg = Path("docs/images/jooan-local-control-logo.svg").read_text(encoding="utf-8")
          if 'viewBox="0 0 1000 400"' not in logo_svg:
              raise SystemExit("jooan-local-control-logo.svg must keep the 1000x400 vector canvas")
          print("OK: jooan-local-control-logo.svg vector 1000x400")
          PY

  docker:
    name: Container build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: ./jooan_ptz
          file: ./jooan_ptz/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_VERSION=0.18.0
            BUILD_ARCH=${{ matrix.arch }}
          tags: local/jooan-local-control:${{ matrix.arch }}
          cache-from: type=gha,scope=jooan-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=jooan-${{ matrix.arch }}
