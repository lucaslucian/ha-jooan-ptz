name: Validate JOOAN Local Control

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest pyyaml -r jooan_ptz/app/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q jooan_ptz/app

      - name: Run tests
        env:
          PYTHONPATH: jooan_ptz/app
        run: pytest -q jooan_ptz/tests

      - name: Validate YAML
        run: |
          python - <<'PY'
          import yaml
          for path in ["repository.yaml", "jooan_ptz/config.yaml"]:
              with open(path, encoding="utf-8") as file:
                  yaml.safe_load(file)
              print(f"OK: {path}")
          PY

  docker:
    name: Container build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: ./jooan_ptz
          file: ./jooan_ptz/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            BUILD_VERSION=0.3.0
            BUILD_ARCH=${{ matrix.arch }}
          tags: local/jooan-local-control:${{ matrix.arch }}
          cache-from: type=gha,scope=jooan-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=jooan-${{ matrix.arch }}
