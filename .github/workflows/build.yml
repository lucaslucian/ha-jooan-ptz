name: Build JOOAN PTZ Add-on

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r jooan_ptz/app/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q jooan_ptz/app

  addon-build:
    name: Build add-on (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
          - arch: i386
            platform: linux/386
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build add-on image
        uses: docker/build-push-action@v6
        with:
          context: ./jooan_ptz
          file: ./jooan_ptz/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.22
          push: false
          tags: local/jooan-ptz:${{ matrix.arch }}
          cache-from: type=gha,scope=jooan-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=jooan-${{ matrix.arch }}

  config-check:
    name: Add-on configuration checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f repository.yaml
          test -f jooan_ptz/config.yaml
          test -f jooan_ptz/build.yaml
          test -f jooan_ptz/Dockerfile
          test -f jooan_ptz/run.sh
          test -f jooan_ptz/app/main.py
          test -f jooan_ptz/app/camera.py
          test -f jooan_ptz/app/requirements.txt

      - name: Validate YAML
        run: |
          python3 - <<'PY'
          import pathlib
          import yaml
          for path in ["repository.yaml", "jooan_ptz/config.yaml", "jooan_ptz/build.yaml"]:
              with open(path, encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"OK: {path}")
          PY
